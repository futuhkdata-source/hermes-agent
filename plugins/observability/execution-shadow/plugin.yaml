name: execution-shadow
version: "0.2.0"
description: "Local, profile-scoped execution-shadow telemetry with an optional default-off advisory sidecar. Never changes control flow."
author: NousResearch / Hermes
kind: standalone
hooks:
  - pre_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_turn_end
  - subagent_start
  - subagent_stop
